{% extends 'base.html' %}

{% block content %}
<div class="feed-header">
    <div class="logo-img" style="width: 32px; height: 32px; background: var(--accent);"></div>
    <div>
        <h2 style="margin-bottom: 0.25rem;">{{ category.name }}</h2>
        <p style="font-size: 0.9rem; color: var(--text-secondary);">{{ category.description }}</p>
    </div>
</div>

<div class="feed-grid">
    {% for post in category.posts.all %}
    <article class="card">
        <div class="card-thumb" style="background: #3f3f46; display: grid; place-items: center; color: #fff; font-size: 1.5rem;">
            {{ post.title|slice:":1" }}
        </div>
        <div class="card-content">
            <h3 class="card-title">
                <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
            </h3>
            <div class="card-meta">
                <span>{{ post.created_at|date:"d.m.Y" }}</span>
            </div>
        </div>
        <a href="{% url 'post_detail' post.pk %}" class="play-icon">▶</a>
    </article>
    {% empty %}
    <div class="card">
        <div class="card-content">
            <p>Nenhum projeto nesta categoria ainda.</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
