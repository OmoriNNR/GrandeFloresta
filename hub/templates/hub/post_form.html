{% extends 'base.html' %}

{% block content %}
<div class="card" style="display: block;">
    <h2 style="margin-bottom: 1.5rem;">{% if object %}Editar{% else %}Novo{% endif %} Projeto</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem;">Título</label>
            <input type="text" name="title" value="{{ form.title.value|default:'' }}" required 
                   style="width: 100%; padding: 0.75rem; background: #18181b; border: 1px solid #3f3f46; border-radius: 8px; color: white;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem;">Conteúdo (HTML permitido)</label>
            <textarea name="content" rows="10" required 
                      style="width: 100%; padding: 0.75rem; background: #18181b; border: 1px solid #3f3f46; border-radius: 8px; color: white;">{{ form.content.value|default:'' }}</textarea>
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem;">Categorias</label>
            {{ form.categories }}
        </div>

        <button type="submit" class="btn-primary">Salvar Projeto</button>
        <a href="{% url 'post_list' %}" style="margin-left: 1rem; color: var(--text-secondary);">Cancelar</a>
    </form>
</div>
{% endblock %}
