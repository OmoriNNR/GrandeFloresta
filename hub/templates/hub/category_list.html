{% extends 'base.html' %}

{% block content %}
<div class="card" style="display: block;">
    <h2 style="margin-bottom: 1.5rem;">Áreas de Atuação</h2>
    <ul class="category-list">
        {% for category in categories %}
        <li class="category-item" style="justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="cat-icon">#</div>
                <a href="{% url 'category_detail' category.pk %}" style="font-size: 1.1rem; font-weight: 500;">
                    {{ category.name }}
                </a>
            </div>
            <span style="color: var(--text-secondary); font-size: 0.9rem;">
                {{ category.posts.count }} projetos
            </span>
        </li>
        {% empty %}
        <p>Nenhuma categoria cadastrada.</p>
        {% endfor %}
    </ul>
</div>
{% endblock %}
