{% extends 'base.html' %}

{% block content %}
<div class="card" style="display: block; max-width: 400px; margin: 2rem auto; padding: 2rem;">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Login</h2>
    
    <form method="post">
        {% csrf_token %}
        
        {% if form.errors %}
            <p style="color: #ef4444; text-align: center; margin-bottom: 1rem;">
                Usuário ou senha incorretos.
            </p>
        {% endif %}

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem;">Usuário</label>
            <input type="text" name="username" autofocus required 
                   style="width: 100%; padding: 0.75rem; background: #18181b; border: 1px solid #3f3f46; border-radius: 8px; color: white;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem;">Senha</label>
            <input type="password" name="password" required 
                   style="width: 100%; padding: 0.75rem; background: #18181b; border: 1px solid #3f3f46; border-radius: 8px; color: white;">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%;">Entrar</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>

    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
        Não tem uma conta? <a href="{% url 'signup' %}" style="color: var(--accent);">Cadastre-se</a>
    </p>
</div>
{% endblock %}
